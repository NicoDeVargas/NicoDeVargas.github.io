# Publica o export estático no GitHub Pages.
# Ative em Settings → Pages → Source: "GitHub Actions".
# O prefixo de URL vem do próprio Pages (repo de projeto → "/<repo>",
# site de usuário <user>.github.io → raiz). Para forçar outro, crie a
# variável de repositório BASE_PATH (Settings → Variables → Actions).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
